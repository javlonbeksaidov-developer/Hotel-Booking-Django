{% extends 'base.html' %}
{% block content %}

<section class="section">
  <div class="container narrow">

    {% if messages %}
    <div class="messages-container">
      {% for message in messages %}
      <div class="message message-{{ message.tags }}">
        <span>{{ message }}</span>

        <button type="button" onclick="this.parentElement.remove()">
          &times;
        </button>
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form class="form" id="bookingForm" method="POST" action="{% url 'bookings:booking' %}">
      {% csrf_token %}

      <div class="field">
        <label for="broom">Xona</label>

        <select id="broom" name="room" required>
          <option value="">Xonani tanlang</option>

          {% for room in rooms %}
          <option value="{{ room.id }}" data-price="{{ room.price_per_night }}" {% if room.id|stringformat:"s" == selected_room_id %}selected{% endif %}>
            {{ room.name }} - ${{ room.price_per_night }}/kecha
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="grid-2">
        <div class="field"><label for="checkin">Kirish sanasi</label><input type="date" id="checkin" name="checkin"
            value="" required></div>
        <div class="field"><label for="checkout">Chiqish sanasi</label><input type="date" id="checkout" name="checkout"
            value="" required></div>
        <div class="field"><label for="adults">Kattalar</label><select id="adults" name="adults">
            <option>1</option>
            <option>2</option>
            <option>3</option>
          </select></div>
        <div class="field"><label for="children">Bolalar</label><select id="children" name="children">
            <option>0</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
          </select></div>
        <div class="field"><label for="gname">To'liq ismingiz</label><input id="gname" name="name" required
            autocomplete="name"></div>
        <div class="field"><label for="gemail">Elektron pochta</label><input id="gemail" type="email" name="email"
            required autocomplete="email"></div>
      </div>
      <p class="total" id="total" role="status" aria-live="polite">Umumiy summani ko'rish uchun sanalarni tanlang.</p>
      <button class="btn btn-gold" type="submit">Buyurtmani tasdiqlash</button>
    </form>
  </div>
</section>

{% endblock content %}
