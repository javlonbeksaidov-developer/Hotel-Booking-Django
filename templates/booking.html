{% extends 'base.html' %}
{% block content %}

<section class="section">
  <div class="container narrow">

    {% if messages %}
    <div class="messages-container">
      {% for message in messages %}
      <div class="message message-{{ message.tags }}">
        <span>{{ message }}</span>

        <button type="button" onclick="this.parentElement.remove()">
          &times;
        </button>
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form class="form" id="bookingForm" method="POST" action="{% url 'bookings:booking' %}">
      {% csrf_token %}

    <div class="field">
        <label for="broom">Room</label>

        <select id="broom" name="room" required>
            <option value="">Select room</option>

            {% for room in rooms %}
                <option
                    value="{{ room.id }}"
                    data-price="{{ room.price_per_night }}"
                    {% if room.id|stringformat:"s" == selected_room_id %}selected{% endif %}
                >
                    {{ room.name }} - ${{ room.price_per_night }}/night
                </option>
            {% endfor %}
        </select>
    </div>

      <div class="grid-2">
        <div class="field"><label for="checkin">Check-in</label><input type="date" id="checkin" name="checkin" value=""
            required></div>
        <div class="field"><label for="checkout">Check-out</label><input type="date" id="checkout" name="checkout"
            value="" required></div>
        <div class="field"><label for="adults">Adults</label><select id="adults" name="adults">
            <option>1</option>
            <option>2</option>
            <option>3</option>
          </select></div>
        <div class="field"><label for="children">Children</label><select id="children" name="children">
            <option>0</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
          </select></div>
        <div class="field"><label for="gname">Full name</label><input id="gname" name="name" required
            autocomplete="name"></div>
        <div class="field"><label for="gemail">Email</label><input id="gemail" type="email" name="email" required
            autocomplete="email"></div>
      </div>
      <p class="total" id="total" role="status" aria-live="polite">Select your dates to see the total.</p>
      <button class="btn btn-gold" type="submit">Confirm Reservation</button>
    </form>
  </div>
</section>

{% endblock content %}
