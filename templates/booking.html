{% extends 'base.html' %}
{% block content %}

<section class="section">
  <div class="container narrow">
    <form class="form" data-demo id="bookingForm">
      {% csrf_token %}
      <div class="field"><label for="broom">Room</label><select id="broom" name="room" required>
          <option value="deluxe-room" data-price="220">Deluxe Room - $220/night</option>
          <option value="executive-suite" data-price="390">Executive Suite - $390/night</option>
          <option value="luxury-family-room" data-price="310">Luxury Family Room - $310/night</option>
        </select></div>
      <div class="grid-2">
        <div class="field"><label for="checkin">Check-in</label><input type="date" id="checkin" name="checkin" value=""
            required></div>
        <div class="field"><label for="checkout">Check-out</label><input type="date" id="checkout" name="checkout"
            value="" required></div>
        <div class="field"><label for="adults">Adults</label><select id="adults" name="adults">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
          </select></div>
        <div class="field"><label for="children">Children</label><select id="children" name="children">
            <option>0</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
          </select></div>
        <div class="field"><label for="gname">Full name</label><input id="gname" name="name" required
            autocomplete="name"></div>
        <div class="field"><label for="gemail">Email</label><input id="gemail" type="email" name="email" required
            autocomplete="email"></div>
      </div>
      <p class="total" id="total" role="status" aria-live="polite">Select your dates to see the total.</p>
      <button class="btn btn-gold" type="submit">Confirm Reservation</button>
    </form>
  </div>
</section>

{% endblock content %}
