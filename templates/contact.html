{% extends 'base.html' %}
{% block content %}

<section class="section">
  <div class="container split">
    <div>
      <ul class="spec">
        <li><span>Manzil</span>{{hotel.address}}, {{hotel.city}}, {{hotel.country}}</li>
        <li><span>Telefon</span><a href="tel:+{{hotel.phone_number}}">{{hotel.phone_number}}</a></li>
        <li><span>Elektron pochta</span><a href="mailto:{{hotel.email}}">{{hotel.email}}</a></li>
        <li><span>Ish vaqti</span>Qabulxona 24 soat ochiq</li>
      </ul>
      <div class="map-box small"><iframe title="Mehmonxona xaritasi" loading="lazy"
          src="https://www.openstreetmap.org/export/embed.html?bbox=69.25,41.29,69.31,41.33&amp;layer=mapnik"></iframe>
      </div>
    </div>

    <form class="form" method="post" action="{% url 'hotels:contact' %}">
      {% csrf_token %}
      <div class="field"><label for="cname">To'liq ismingiz</label><input id="cname" name="name" required autocomplete="name">
      </div>
      <div class="field"><label for="cemail">Elektron pochta</label><input id="cemail" type="email" name="email" required
          autocomplete="email"></div>
      <div class="field"><label for="csub">Mavzu</label><input id="csub" name="subject" required></div>
      <div class="field"><label for="cmsg">Xabar</label><textarea id="cmsg" name="message" rows="5"
          required></textarea></div>
      <button class="btn btn-gold" type="submit">Xabar yuborish</button>
    </form>

  </div>
</section>

{% endblock content %}
