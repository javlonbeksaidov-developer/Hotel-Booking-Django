{% extends 'base.html' %}
{% block content %}

<section class="section">
  <div class="container split">
    <div>
      <h2>Getting here</h2>
      <p class="muted">{{hotel.address}}, {{hotel.city}}, {{hotel.country}}</p>
      <ul class="spec">
        <li><span>Airport</span>15 minutes by car</li>
        <li><span>Railway station</span>10 minutes</li>
        <li><span>Main square</span>5-minute walk</li>
        <li><span>Metro</span>3-minute walk</li>
      </ul>
      <a class="btn btn-gold" href="https://www.openstreetmap.org/directions?to=41.3111,69.2797" target="_blank"
        rel="noopener">Get Directions</a>
    </div>
    <div class="map-box"><iframe title="Hotel location map" loading="lazy"
        src="https://www.openstreetmap.org/export/embed.html?bbox=69.25,41.29,69.31,41.33&amp;layer=mapnik"></iframe>
    </div>
  </div>
</section>

{% endblock content %}
